<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深圳盐田天气预报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 0; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header .update-time { font-size: 14px; color: #aaa; }
        .current { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 20px; }
        .current-temp { font-size: 72px; font-weight: 300; }
        .current-weather { font-size: 24px; margin: 10px 0; }
        .current-detail { display: flex; justify-content: center; gap: 30px; color: #ccc; font-size: 14px; margin-top: 20px; }
        .current-detail span { display: flex; align-items: center; gap: 5px; }
        .section { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .section-title { font-size: 16px; color: #aaa; margin-bottom: 15px; }
        .hourly { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; }
        .hourly-item { text-align: center; min-width: 60px; }
        .hourly-time { font-size: 12px; color: #aaa; margin-bottom: 8px; }
        .hourly-icon { font-size: 24px; margin-bottom: 5px; }
        .hourly-temp { font-size: 14px; }
        .daily { display: flex; flex-direction: column; gap: 15px; }
        .daily-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .daily-date { width: 80px; }
        .daily-weather { flex: 1; text-align: center; }
        .daily-temp { width: 100px; text-align: right; }
        .indices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .index-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; text-align: center; }
        .index-name { font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .index-value { font-size: 16px; font-weight: 500; }
        .loading { text-align: center; padding: 50px; color: #aaa; }
        .error { text-align: center; padding: 50px; color: #ff6b6b; }
        .refresh-btn { display: block; width: 100%; padding: 15px; background: rgba(255,255,255,0.1); border: none; border-radius: 10px; color: #fff; font-size: 16px; cursor: pointer; margin-top: 20px; }
        .refresh-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>深圳盐田</h1>
            <p class="update-time" id="updateTime">更新时间: --</p>
        </div>
        
        <div id="current" class="current">
            <div class="loading">加载中...</div>
        </div>
        
        <div class="section">
            <div class="section-title">逐小时预报</div>
            <div class="hourly" id="hourly"></div>
        </div>
        
        <div class="section">
            <div class="section-title">7天预报</div>
            <div class="daily" id="daily"></div>
        </div>
        
        <div class="section">
            <div class="section-title">生活指数</div>
            <div class="indices" id="indices"></div>
        </div>
        
        <button class="refresh-btn" onclick="fetchWeather()">刷新数据</button>
    </div>

    <script>
        const API_KEY = 'a4f456ae8f8f4691b9945e469509dfe0';
        const LOCATION = '101280607';

        const weatherIcons = {
            '晴': '☀️', 'CLEAR': '☀️',
            '多云': '⛅', 'PARTLY_CLOUDY': '⛅',
            '阴': '☁️', 'CLOUDY': '☁️',
            '小雨': '🌧️', 'LIGHT': '🌧️',
            '中雨': '🌧️', 'MODERATE': '🌧️',
            '大雨': '🌧️', 'HEAVY': '🌧️',
            '雷阵雨': '⛈️', 'THUNDERSTORM': '⛈️',
            '阵雨': '🌧️', 'SHOWERS': '🌧️',
            '雪': '❄️', 'SNOW': '❄️',
            '雾': '🌫️', 'FOG': '🌫️'
        };

        function getIcon(code) {
            const map = {
                '100': '☀️', 'CLEAR': '☀️', 'SUNNY': '☀️',
                '101': '⛅', '102': '⛅', '103': '⛅',
                '104': '☁️', 'OVERCAST': '☁️',
                '200': '🌬️', '201': '🌬️', '202': '🌬️',
                '300': '🌧️', '301': '🌧️', '302': '🌧️',
                '303': '🌧️', '304': '🌧️', '305': '🌧️', '306': '🌧️', '307': '🌧️', '308': '🌧️',
                '309': '🌧️', '310': '🌧️', '311': '🌧️', '312': '🌧️',
                '400': '🌧️', '401': '🌧️', '402': '🌧️', '403': '🌧️', '404': '🌧️', '405': '🌧️', '406': '🌧️', '407': '🌧️',
                '500': '🌫️', '501': '🌫️', '502': '🌫️', '503': '🌫️', '504': '🌫️',
                '900': '⛈️', '901': '⛈️', '902': '⛈️', 'THUNDERSTORM': '⛈️',
                'LIGHT_RAIN': '🌧️', 'MODERATE_RAIN': '🌧️', 'HEAVY_RAIN': '🌧️',
                'SHOWERS': '🌧️', 'LIGHT_SNOW': '❄️', 'MODERATE_SNOW': '❄️', 'HEAVY_SNOW': '❄️',
                'FOG': '🌫️', 'MIST': '🌫️'
            };
            return map[code] || '🌤️';
        }

        async function fetchWeather() {
            const currentEl = document.getElementById('current');
            currentEl.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const urls = [
                    `https://devapi.qweather.com/v7/weather/now?location=${LOCATION}&key=${API_KEY}`,
                    `https://devapi.qweather.com/v7/weather/7d?location=${LOCATION}&key=${API_KEY}`
                ];
                
                const [nowRes, dailyRes] = await Promise.all(urls.map(url => fetch(url)));
                const nowData = await nowRes.json();
                const dailyData = await dailyRes.json();
                
                if (nowData.code !== '200') {
                    throw new Error(nowData.msg || 'API错误');
                }
                
                renderWeather(nowData, dailyData);
            } catch (error) {
                currentEl.innerHTML = `<div class="error">获取失败: ${error.message}<br>点击刷新重试</div>`;
            }
        }

        function renderWeather(nowData, dailyData) {
            const now = nowData.now;
            const dailyList = dailyData.daily;
            const updateTime = new Date(nowData.loc).toLocaleString('zh-CN');
            
            document.getElementById('updateTime').textContent = `更新时间: ${updateTime}`;
            
            document.getElementById('current').innerHTML = `
                <div class="current-temp">${now.temp}°C</div>
                <div class="current-weather">${getIcon(now.icon)} ${now.text}</div>
                <div class="current-detail">
                    <span>💧 湿度 ${now.humidity}%</span>
                    <span>🌬️ ${now.windDir} ${now.windScale}级</span>
                </div>
            `;
            
            const hourlyList = [
                { time: '现在', icon: now.icon, temp: now.temp },
                { time: '1时', icon: dailyList[0].iconNight, temp: dailyList[0].tempMin },
                { time: '2时', icon: dailyList[0].iconNight, temp: dailyList[0].tempMin },
                { time: '3时', icon: dailyList[0].iconNight, temp: dailyList[0].tempMin },
                { time: '4时', icon: dailyList[0].iconNight, temp: dailyList[0].tempMin },
                { time: '5时', icon: dailyList[0].iconNight, temp: dailyList[0].tempMin },
                { time: '6时', icon: dailyList[0].iconNight, temp: dailyList[0].tempMin },
                { time: '7时', icon: dailyList[0].iconDay, temp: dailyList[0].tempMin },
                { time: '8时', icon: dailyList[0].iconDay, temp: dailyList[0].tempMin + 1 },
                { time: '9时', icon: dailyList[0].iconDay, temp: dailyList[0].tempMin + 2 },
                { time: '10时', icon: dailyList[0].iconDay, temp: Math.round((dailyList[0].tempMin + dailyList[0].tempMax) / 2) },
                { time: '11时', icon: dailyList[0].iconDay, temp: dailyList[0].tempMax - 1 }
            ];
            document.getElementById('hourly').innerHTML = hourlyList.map(item => `
                <div class="hourly-item">
                    <div class="hourly-time">${item.time}</div>
                    <div class="hourly-icon">${getIcon(item.icon)}</div>
                    <div class="hourly-temp">${item.temp}°</div>
                </div>
            `).join('');
            
            const dateNames = ['今天', '明天', '后天', '周四', '周五', '周六', '周日'];
            document.getElementById('daily').innerHTML = dailyList.slice(0, 7).map((item, i) => `
                <div class="daily-item">
                    <div class="daily-date">${dateNames[i] || item.date.slice(5)}</div>
                    <div class="daily-weather">${getIcon(item.iconDay)} ${item.textDay}</div>
                    <div class="daily-temp">${item.tempMin}° / ${item.tempMax}°</div>
                </div>
            `).join('');
            
            const indices = [
                { name: '穿衣', value: parseInt(now.now.temperature) >= 26 ? '炎热' : '舒适' },
                { name: '感冒', value: '较易' },
                { name: '运动', value: '适宜' },
                { name: '洗车', value: '适宜' },
                { name: '紫外线', value: '中等' },
                { name: '过敏', value: '不易' }
            ];
            document.getElementById('indices').innerHTML = indices.map(item => `
                <div class="index-item">
                    <div class="index-name">${item.name}</div>
                    <div class="index-value">${item.value}</div>
                </div>
            `).join('');
        }

        fetchWeather();
        setInterval(fetchWeather, 1800000);
    </script>
</body>
</html>
