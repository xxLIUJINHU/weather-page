<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深圳盐田天气预报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 0; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header .update-time { font-size: 14px; color: #aaa; }
        .current { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 20px; }
        .current-temp { font-size: 72px; font-weight: 300; }
        .current-weather { font-size: 24px; margin: 10px 0; }
        .current-detail { display: flex; justify-content: center; gap: 30px; color: #ccc; font-size: 14px; margin-top: 20px; }
        .current-detail span { display: flex; align-items: center; gap: 5px; }
        .section { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .section-title { font-size: 16px; color: #aaa; margin-bottom: 15px; }
        .hourly { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; }
        .hourly-item { text-align: center; min-width: 60px; }
        .hourly-time { font-size: 12px; color: #aaa; margin-bottom: 8px; }
        .hourly-icon { font-size: 24px; margin-bottom: 5px; }
        .hourly-temp { font-size: 14px; }
        .daily { display: flex; flex-direction: column; gap: 15px; }
        .daily-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .daily-date { width: 80px; }
        .daily-weather { flex: 1; text-align: center; }
        .daily-temp { width: 100px; text-align: right; }
        .indices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .index-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; text-align: center; }
        .index-name { font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .index-value { font-size: 16px; font-weight: 500; }
        .loading { text-align: center; padding: 50px; color: #aaa; }
        .error { text-align: center; padding: 50px; color: #ff6b6b; }
        .refresh-btn { display: block; width: 100%; padding: 15px; background: rgba(255,255,255,0.1); border: none; border-radius: 10px; color: #fff; font-size: 16px; cursor: pointer; margin-top: 20px; }
        .refresh-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>深圳盐田</h1>
            <p class="update-time" id="updateTime">更新时间: --</p>
        </div>
        
        <div id="current" class="current">
            <div class="loading">加载中...</div>
        </div>
        
        <div class="section">
            <div class="section-title">逐小时预报</div>
            <div class="hourly" id="hourly"></div>
        </div>
        
        <div class="section">
            <div class="section-title">7天预报</div>
            <div class="daily" id="daily"></div>
        </div>
        
        <div class="section">
            <div class="section-title">生活指数</div>
            <div class="indices" id="indices"></div>
        </div>
        
        <button class="refresh-btn" onclick="fetchWeather()">刷新数据</button>
    </div>

    <script>
        const LAT = '22.56';
        const LON = '114.25';

        function getIcon(code) {
            const map = {
                0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
                45: '🌫️', 48: '🌫️',
                51: '🌧️', 53: '🌧️', 55: '🌧️',
                61: '🌧️', 63: '🌧️', 65: '🌧️',
                71: '❄️', 73: '❄️', 75: '❄️',
                80: '🌧️', 81: '🌧️', 82: '🌧️',
                95: '⛈️', 96: '⛈️', 99: '⛈️'
            };
            return map[code] || '🌤️';
        }

        function getWeatherText(code) {
            const texts = {
                0: '晴', 1: '晴间多云', 2: '多云', 3: '阴',
                45: '雾', 48: '雾',
                51: '小毛毛雨', 53: '中毛毛雨', 55: '大毛毛雨',
                61: '小雨', 63: '中雨', 65: '大雨',
                71: '小雪', 73: '中雪', 75: '大雪',
                80: '小阵雨', 81: '中阵雨', 82: '大阵雨',
                95: '雷暴', 96: '雷暴', 99: '雷暴'
            };
            return texts[code] || '未知';
        }

        async function fetchWeather() {
            const currentEl = document.getElementById('current');
            currentEl.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai&forecast_days=7`;
                
                const res = await fetch(url);
                const data = await res.json();
                
                if (!data.current) {
                    throw new Error('数据获取失败');
                }
                
                renderWeather(data);
            } catch (error) {
                currentEl.innerHTML = `<div class="error">获取失败: ${error.message}<br>点击刷新重试</div>`;
            }
        }

        function renderWeather(data) {
            const now = data.current;
            const hourly = data.hourly;
            const daily = data.daily;
            const nowTime = new Date().toLocaleString('zh-CN');
            
            document.getElementById('updateTime').textContent = `更新时间: ${nowTime}`;
            
            document.getElementById('current').innerHTML = `
                <div class="current-temp">${Math.round(now.temperature_2m)}°C</div>
                <div class="current-weather">${getIcon(now.weather_code)} ${getWeatherText(now.weather_code)}</div>
                <div class="current-detail">
                    <span>💧 湿度 ${now.relative_humidity_2m}%</span>
                    <span>🌬️ 风速 ${Math.round(now.wind_speed_10m)}km/h</span>
                </div>
            `;
            
            const currentHour = new Date().getHours();
            const hourlyList = [];
            for (let i = 0; i < 12; i++) {
                const idx = currentHour + i;
                hourlyList.push({
                    time: i === 0 ? '现在' : `${(currentHour + i) % 24}时`,
                    icon: hourly.weather_code[idx],
                    temp: Math.round(hourly.temperature_2m[idx])
                });
            }
            
            document.getElementById('hourly').innerHTML = hourlyList.map(item => `
                <div class="hourly-item">
                    <div class="hourly-time">${item.time}</div>
                    <div class="hourly-icon">${getIcon(item.icon)}</div>
                    <div class="hourly-temp">${item.temp}°</div>
                </div>
            `).join('');
            
            const dateNames = ['今天', '明天', '后天', '周四', '周五', '周六', '周日'];
            document.getElementById('daily').innerHTML = daily.time.map((date, i) => `
                <div class="daily-item">
                    <div class="daily-date">${dateNames[i] || date.slice(5)}</div>
                    <div class="daily-weather">${getIcon(daily.weather_code[i])} ${getWeatherText(daily.weather_code[i])}</div>
                    <div class="daily-temp">${Math.round(daily.temperature_2m_min[i])}° / ${Math.round(daily.temperature_2m_max[i])}°</div>
                </div>
            `).join('');
            
            const temp = Math.round(now.temperature_2m);
            const indices = [
                { name: '穿衣', value: temp >= 28 ? '炎热' : temp >= 20 ? '舒适' : '较凉' },
                { name: '感冒', value: '较易' },
                { name: '运动', value: '适宜' },
                { name: '洗车', value: '适宜' },
                { name: '紫外线', value: '中等' },
                { name: '过敏', value: '不易' }
            ];
            document.getElementById('indices').innerHTML = indices.map(item => `
                <div class="index-item">
                    <div class="index-name">${item.name}</div>
                    <div class="index-value">${item.value}</div>
                </div>
            `).join('');
        }

        fetchWeather();
        setInterval(fetchWeather, 1800000);
    </script>
</body>
</html>
